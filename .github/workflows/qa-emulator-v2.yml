name: TarikhYar 2.0 Android Install QA

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  emulator-install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign QA APK with official Android tools
        shell: bash
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          keytool -genkeypair -v -keystore qa.jks -storepass android -keypass android -alias qa -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=TarikhYar QA,O=AS Team,C=IR"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f -v 4 "$UNSIGNED" TarikhYar-2.0.0-qa-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks qa.jks --ks-pass pass:android --key-pass pass:android --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out TarikhYar-2.0.0-qa.apk TarikhYar-2.0.0-qa-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs TarikhYar-2.0.0-qa.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 TarikhYar-2.0.0-qa.apk

      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r TarikhYar-2.0.0-qa.apk
            adb shell am start -W -n ir.tarikhyar.app/.MainActivity
            sleep 5
            adb shell pm list packages | grep ir.tarikhyar.app
            adb shell dumpsys package ir.tarikhyar.app | grep -E 'versionCode|versionName' | head
            adb shell pidof ir.tarikhyar.app
            adb exec-out screencap -p > tarikhyar-android15.png
            adb shell uiautomator dump /sdcard/tarikhyar-ui.xml || true
            adb pull /sdcard/tarikhyar-ui.xml tarikhyar-ui.xml || true
            if adb logcat -d -b crash | grep -q 'ir.tarikhyar.app'; then adb logcat -d -b crash; exit 1; fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TarikhYar-2.0.0-Android15-QA
          path: |
            tarikhyar-android15.png
            tarikhyar-ui.xml
          if-no-files-found: warn
