# این Workflow امن فقط سلامت سورس تاریخ‌یار را تست می‌کند و به هیچ کلید امضا یا رمز انتشار دسترسی ندارد.
name: Validate TarikhYar Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # آخرین سورس main را برای تست دریافت می‌کند.
      - name: Checkout
        uses: actions/checkout@v4

      # پروژه با Java 17 ساخته می‌شود.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK مورد نیاز Gradle را آماده می‌کند.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Platform و Build Tools مطابق تنظیمات برنامه نصب می‌شوند.
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      # Gradle ثابت CI برای تکرارپذیر بودن Build آماده می‌شود.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # تست‌های منطقی پیش از Build اجرا می‌شوند.
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      # Release غیرقابل Debug کامپایل می‌شود؛ این CI عمومی هیچ Signing Key دریافت نمی‌کند.
      - name: Build release
        run: gradle assembleRelease --stacktrace
