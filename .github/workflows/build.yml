# Workflow عمومی سورس را با استاندارد کامنت‌گذاری پروژه تست و APK Release بدون امضا را به عنوان Artifact ذخیره می‌کند.
name: Validate TarikhYar Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply educational source comments
        run: python3 tools/apply_source_comments.py

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build release
        run: gradle assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: TarikhYar-2.0.0-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
