name: Finalize TarikhYar 2.0 Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final QA fixes
        run: python3 tools/apply_v2_finalization.py

      - name: Apply AS Team explanatory comments
        run: python3 tools/apply_source_comments.py

      - name: Commit finalized source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle.kts settings.gradle.kts tools/CoreSmokeTest.kt
          git commit -m "Finalize TarikhYar 2.0 QA and AS Team source comments"
          git push
