name: Export Android APK Verification Tools

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Build Tools 35
        run: sdkmanager --install "build-tools;35.0.0"
      - name: Package verifier tools
        shell: bash
        run: |
          mkdir -p verifier-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" verifier-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" verifier-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verifier-tools/lib/
          chmod +x verifier-tools/apksigner verifier-tools/zipalign
      - name: Upload verifier tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-verifier-35.0.0
          path: verifier-tools
          if-no-files-found: error
